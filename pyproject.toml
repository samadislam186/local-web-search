[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "opensearch-local"
version = "0.1.0"
description = "CPU-first local web search engine"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
  "blake3>=1.0.0",
  "cryptography>=45.0",
  "fastapi>=0.116",
  "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.8"]
tantivy = ["tantivy>=0.26,<0.27"]
performance = ["psutil>=5.9"]

[project.scripts]
open-search = "search_engine.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/search_engine"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
